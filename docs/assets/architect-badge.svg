<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="100%" height="100%">
  <defs>
    <linearGradient id="terminalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d10" />
      <stop offset="100%" stop-color="#0c171d" />
    </linearGradient>

    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d8bd84" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#82b99d" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#d8bd84" stop-opacity="0.6" />
    </linearGradient>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor { animation: cursorBlink 1s infinite; }
  </style>

  <!-- Container Box -->
  <rect width="880" height="180" rx="12" fill="url(#terminalBg)" stroke="url(#borderGlow)" stroke-width="1.5" />

  <!-- Terminal Top Bar -->
  <rect width="880" height="36" rx="12" fill="#0d181e" />
  <rect width="880" height="1" y="35" fill="#20343a" />
  
  <!-- Terminal Window Controls -->
  <circle cx="24" cy="18" r="5" fill="#e76f51" />
  <circle cx="42" cy="18" r="5" fill="#e9c46a" />
  <circle cx="60" cy="18" r="5" fill="#2a9d8f" />
  <text x="80" y="22" fill="#758880" font-family="ui-monospace, monospace" font-size="11" font-weight="600">revaan@pros-core: ~ /system/manifest</text>

  <!-- Content Grid -->
  <g transform="translate(30, 60)">
    <!-- Left Column: Architect Bio -->
    <text x="0" y="24" fill="#a7d9c3" font-family="ui-monospace, monospace" font-size="13" font-weight="700">
      SYSTEM ARCHITECT:
    </text>
    <text x="175" y="24" fill="#fdfbf7" font-family="Georgia, serif" font-size="20" font-weight="700" filter="url(#textGlow)">
      Revaan Mishra
    </text>

    <text x="0" y="54" fill="#8ca097" font-family="ui-monospace, monospace" font-size="11.5">
      PHILOSOPHY : Effort = XP. Zero streak guilt. 100% Local-first data sovereignty.
    </text>
    <text x="0" y="74" fill="#8ca097" font-family="ui-monospace, monospace" font-size="11.5">
      CORE STACK : TypeScript • React 19 • Dexie (IndexedDB) • WebGL • Offline-First PWA
    </text>
    <text x="0" y="94" fill="#8ca097" font-family="ui-monospace, monospace" font-size="11.5">
      CO-PILOTS  : Freddie, Olive, Coco &amp; Mungru (The Canine Council)
    </text>

    <!-- Right Side: Live Terminal Status -->
    <g transform="translate(630, 10)">
      <rect width="190" height="85" rx="8" fill="#070c0e" stroke="#253a40" stroke-width="1" />
      <text x="14" y="26" fill="#82b99d" font-family="ui-monospace, monospace" font-size="10" font-weight="700">● KERNEL ACTIVE</text>
      <text x="14" y="44" fill="#758880" font-family="ui-monospace, monospace" font-size="9.5">TELEMETRY: ZERO</text>
      <text x="14" y="60" fill="#758880" font-family="ui-monospace, monospace" font-size="9.5">LOCK-IN: NONE</text>
      <text x="14" y="76" fill="#d8bd84" font-family="ui-monospace, monospace" font-size="9.5">PROS_REV: 1.0.0<tspan class="cursor" fill="#82b99d">_</tspan></text>
    </g>
  </g>
</svg>
