<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="100%" height="100%">
  <defs>
    <!-- Card Gradients -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111c22" />
      <stop offset="100%" stop-color="#081216" />
    </linearGradient>

    <!-- Freddie: Celestial Gold & Midnight Black for Black Lab -->
    <linearGradient id="freddieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#2a2d34" />
      <stop offset="100%" stop-color="#111317" />
    </linearGradient>

    <!-- Olive: Pure Snow White & Gentle Teal for American Spitz -->
    <linearGradient id="oliveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8edea" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Coco: Warm Golden Beige for Beige Indie -->
    <linearGradient id="cocoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8c89b" />
      <stop offset="100%" stop-color="#d4a373" />
    </linearGradient>

    <!-- Mungru: Black & Warm Tan/Beige for Black-and-Beige Indie -->
    <linearGradient id="mungruGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b3137" />
      <stop offset="60%" stop-color="#d8ab76" />
      <stop offset="100%" stop-color="#c6955a" />
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.5" />
    </filter>

    <filter id="haloGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes starTwinkle {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    .float-card-1 { animation: gentleFloat 4s ease-in-out infinite; }
    .float-card-2 { animation: gentleFloat 4s ease-in-out infinite 1s; }
    .float-card-3 { animation: gentleFloat 4s ease-in-out infinite 2s; }
    .float-card-4 { animation: gentleFloat 4s ease-in-out infinite 3s; }
    .halo-twinkle { animation: starTwinkle 3s ease-in-out infinite; transform-origin: 97.5px 18px; }
  </style>

  <!-- Section Background Container -->
  <rect width="880" height="390" rx="16" fill="#060b0e" stroke="#22363d" stroke-width="1.5" />

  <!-- Section Header -->
  <g transform="translate(30, 24)">
    <text x="0" y="20" fill="#d8bd84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="10" font-weight="700" letter-spacing="2">
      THE CANINE COUNCIL • THE SOUL OF PROS
    </text>
    <text x="0" y="46" fill="#fdfcf7" font-family="Georgia, serif" font-size="22" font-weight="700">
      Four Faithful Companions &amp; Guardians
    </text>
    <text x="490" y="44" fill="#8ca097" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-style="italic">
      "No realm is restored alone. Meet the four-legged council behind PROS."
    </text>
  </g>

  <!-- ==================== CARD 1: FREDDIE ==================== -->
  <g class="float-card-1" transform="translate(25, 92)" filter="url(#cardShadow)">
    <rect width="195" height="272" rx="12" fill="url(#cardBg)" stroke="#d4af37" stroke-opacity="0.4" stroke-width="1.5" />
    <rect width="195" height="6" rx="3" fill="#d4af37" />

    <!-- Celestial Halo for Freddie (RIP) -->
    <ellipse cx="97.5" cy="22" rx="24" ry="7" fill="none" stroke="#f6d365" stroke-width="2" opacity="0.85" filter="url(#haloGlow)" />
    <polygon points="97.5,12 100,16 104,16 101,19 102,23 97.5,20 93,23 94,19 91,16 95,16" fill="#f6d365" class="halo-twinkle" />

    <!-- Avatar Circle -->
    <circle cx="97.5" cy="62" r="34" fill="#0d1114" stroke="#d4af37" stroke-width="2" />

    <!-- Freddie Avatar: Sleek Black Labrador -->
    <g transform="translate(73.5, 38)">
      <path d="M7,16 C0,10 2,28 8,34 C12,36 17,26 15,20 Z" fill="#14171a" />
      <path d="M41,16 C48,10 46,28 40,34 C36,36 31,26 33,20 Z" fill="#14171a" />
      <ellipse cx="24" cy="26" rx="20" ry="18" fill="#1e2227" />
      <ellipse cx="24" cy="31" rx="12" ry="9" fill="#282e35" />
      <polygon points="24,28 20,24 28,24" fill="#0a0c0e" />
      <circle cx="16" cy="22" r="3.2" fill="#0a0c0e" />
      <circle cx="16" cy="22" r="2.2" fill="#5c3c1e" />
      <circle cx="15.2" cy="21.2" r="1" fill="#fff" />
      <circle cx="32" cy="22" r="3.2" fill="#0a0c0e" />
      <circle cx="32" cy="22" r="2.2" fill="#5c3c1e" />
      <circle cx="31.2" cy="21.2" r="1" fill="#fff" />
      <path d="M19,33 Q24,37 29,33" fill="none" stroke="#0a0c0e" stroke-width="1.6" stroke-linecap="round" />
      <rect x="13" y="41" width="22" height="4" rx="2" fill="#d4af37" />
      <circle cx="24" cy="46" r="3" fill="#f6d365" />
    </g>

    <!-- Name & Title -->
    <text x="97.5" y="118" text-anchor="middle" fill="#fdfbf7" font-family="Georgia, serif" font-size="16.5" font-weight="700">FREDDIE</text>
    <text x="97.5" y="133" text-anchor="middle" fill="#f6d365" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" letter-spacing="1">ETERNAL SENTINEL (RIP)</text>

    <!-- Stats & Lore -->
    <g transform="translate(16, 146)">
      <rect x="0" y="0" width="163" height="18" rx="4" fill="#080e11" />
      <text x="8" y="12" fill="#f6d365" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">AURA: ETERNAL PEACE</text>
      <text x="120" y="12" fill="#a7d9c3" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">RIP 🕊️</text>

      <text x="0" y="32" fill="#a7b5ae" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="600">ROLE IN PROS:</text>
      <text x="0" y="46" fill="#fdfcf7" font-family="Georgia, serif" font-size="11" font-weight="600">The Grand Knight</text>

      <text x="0" y="64" fill="#8ca097" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-style="italic">
        The noble sentinel whose spirit, unwavering loyalty, and calm wisdom watch over every journey.
      </text>
    </g>
  </g>

  <!-- ==================== CARD 2: OLIVE ==================== -->
  <g class="float-card-2" transform="translate(235, 92)" filter="url(#cardShadow)">
    <rect width="195" height="272" rx="12" fill="url(#cardBg)" stroke="#82b99d" stroke-opacity="0.4" stroke-width="1.5" />
    <rect width="195" height="6" rx="3" fill="#a8edea" />

    <!-- Avatar Circle -->
    <circle cx="97.5" cy="62" r="34" fill="#0f1f1c" stroke="#a8edea" stroke-width="2" />

    <!-- Olive Avatar: Pure Snow-White American Spitz -->
    <g transform="translate(73.5, 37)">
      <polygon points="11,20 5,3 19,12" fill="#ffffff" />
      <polygon points="11,18 8,7 17,13" fill="#fcd3de" />
      <polygon points="37,20 43,3 29,12" fill="#ffffff" />
      <polygon points="37,18 40,7 31,13" fill="#fcd3de" />
      <circle cx="24" cy="26" r="19" fill="#ffffff" />
      <ellipse cx="8" cy="28" rx="5" ry="7" fill="#ffffff" />
      <ellipse cx="40" cy="28" rx="5" ry="7" fill="#ffffff" />
      <ellipse cx="17" cy="24" rx="2.8" ry="3.5" fill="#1b2520" />
      <circle cx="16.2" cy="23" r="1" fill="#fff" />
      <ellipse cx="31" cy="24" rx="2.8" ry="3.5" fill="#1b2520" />
      <circle cx="30.2" cy="23" r="1" fill="#fff" />
      <ellipse cx="24" cy="29" rx="2.8" ry="2" fill="#1b2520" />
      <path d="M21,32 Q24,35 27,32" fill="none" stroke="#1b2520" stroke-width="1.5" stroke-linecap="round" />
      <rect x="13" y="41" width="22" height="4" rx="2" fill="#2d6a62" />
      <circle cx="24" cy="46" r="3.2" fill="#d8bd84" />
    </g>

    <!-- Name & Title -->
    <text x="97.5" y="118" text-anchor="middle" fill="#fdfbf7" font-family="Georgia, serif" font-size="16.5" font-weight="700">OLIVE</text>
    <text x="97.5" y="133" text-anchor="middle" fill="#a7d9c3" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" letter-spacing="1">THE REALM NAVIGATOR</text>

    <!-- Stats & Lore -->
    <g transform="translate(16, 146)">
      <rect x="0" y="0" width="163" height="18" rx="4" fill="#080e11" />
      <text x="8" y="12" fill="#a7d9c3" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">IN-GAME COMPANION</text>
      <text x="122" y="12" fill="#f6d365" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">★ CORE</text>

      <text x="0" y="32" fill="#a7b5ae" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="600">ROLE IN PROS:</text>
      <text x="0" y="46" fill="#fdfcf7" font-family="Georgia, serif" font-size="11" font-weight="600">The Guide &amp; Compass</text>

      <text x="0" y="64" fill="#8ca097" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-style="italic">
        The loyal spirit guide inside the app. Provides quiet on-device orientation with zero nag telemetry.
      </text>
    </g>
  </g>

  <!-- ==================== CARD 3: COCO ==================== -->
  <g class="float-card-3" transform="translate(445, 92)" filter="url(#cardShadow)">
    <rect width="195" height="272" rx="12" fill="url(#cardBg)" stroke="#d4a373" stroke-opacity="0.4" stroke-width="1.5" />
    <rect width="195" height="6" rx="3" fill="#e8c89b" />

    <!-- Avatar Circle -->
    <circle cx="97.5" cy="62" r="34" fill="#241910" stroke="#e8c89b" stroke-width="2" />

    <!-- Coco Avatar: Alert perky ears, golden smile -->
    <g transform="translate(73.5, 38)">
      <path d="M10,18 C4,4 12,-1 19,8 C21,13 19,20 13,20 Z" fill="#d8ab76" />
      <path d="M38,18 C44,4 36,-1 29,8 C27,13 29,20 35,20 Z" fill="#d8ab76" />
      <ellipse cx="24" cy="26" rx="19" ry="17" fill="#ebd2b0" />
      <ellipse cx="24" cy="30" rx="11" ry="8" fill="#f7e8d3" />
      <polygon points="24,28 21,25 27,25" fill="#302012" />
      <ellipse cx="16" cy="22" rx="3" ry="3.5" fill="#201108" />
      <circle cx="15.2" cy="21" r="1.2" fill="#fff" />
      <ellipse cx="32" cy="22" rx="3" ry="3.5" fill="#201108" />
      <circle cx="31.2" cy="21" r="1.2" fill="#fff" />
      <path d="M20,33 Q24,36 28,33" fill="none" stroke="#201108" stroke-width="1.5" />
      <ellipse cx="24" cy="36" rx="2.5" ry="3.5" fill="#ff758f" />
      <rect x="13" y="41" width="22" height="4" rx="2" fill="#e76f51" />
      <circle cx="24" cy="46" r="3" fill="#e9c46a" />
    </g>

    <!-- Name & Title -->
    <text x="97.5" y="118" text-anchor="middle" fill="#fdfbf7" font-family="Georgia, serif" font-size="16.5" font-weight="700">COCO</text>
    <text x="97.5" y="133" text-anchor="middle" fill="#e8c89b" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" letter-spacing="1">ZOOMIES ALCHEMIST</text>

    <!-- Stats & Lore -->
    <g transform="translate(16, 146)">
      <rect x="0" y="0" width="163" height="18" rx="4" fill="#080e11" />
      <text x="8" y="12" fill="#e8c89b" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">ENERGY: 100%</text>
      <text x="108" y="12" fill="#f6d365" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">ZOOMIES: ∞</text>

      <text x="0" y="32" fill="#a7b5ae" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="600">ROLE IN PROS:</text>
      <text x="0" y="46" fill="#fdfcf7" font-family="Georgia, serif" font-size="11" font-weight="600">The Kinetic Spark</text>

      <text x="0" y="64" fill="#8ca097" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-style="italic">
        The spirited spark whose boundless kinetic joy converts mental fatigue into sudden creative momentum.
      </text>
    </g>
  </g>

  <!-- ==================== CARD 4: MUNGRU ==================== -->
  <g class="float-card-4" transform="translate(655, 92)" filter="url(#cardShadow)">
    <rect width="195" height="272" rx="12" fill="url(#cardBg)" stroke="#8da0b6" stroke-opacity="0.4" stroke-width="1.5" />
    <rect width="195" height="6" rx="3" fill="#d8ab76" />

    <!-- Avatar Circle -->
    <circle cx="97.5" cy="62" r="34" fill="#151b1f" stroke="#8da0b6" stroke-width="2" />

    <!-- Mungru Avatar -->
    <g transform="translate(73.5, 38)">
      <path d="M9,16 C2,10 4,24 10,28 C14,30 18,22 15,16 Z" fill="#1b2126" />
      <path d="M39,16 C46,10 44,24 38,28 C34,30 30,22 33,16 Z" fill="#1b2126" />
      <ellipse cx="24" cy="26" rx="20" ry="18" fill="#20272d" />
      <ellipse cx="16" cy="17" rx="2.5" ry="1.8" fill="#d8ab76" />
      <ellipse cx="32" cy="17" rx="2.5" ry="1.8" fill="#d8ab76" />
      <ellipse cx="24" cy="31" rx="12" ry="9" fill="#d8ab76" />
      <polygon points="24,28 20,24 28,24" fill="#0f1418" />
      <circle cx="16" cy="23" r="3" fill="#0f1418" />
      <circle cx="15.2" cy="22.2" r="1" fill="#fff" />
      <circle cx="32" cy="23" r="3" fill="#0f1418" />
      <circle cx="31.2" cy="22.2" r="1" fill="#fff" />
      <path d="M19,34 Q24,37 29,34" fill="none" stroke="#0f1418" stroke-width="1.5" stroke-linecap="round" />
      <rect x="13" y="41" width="22" height="4" rx="2" fill="#4a6b5d" />
      <circle cx="24" cy="46" r="3" fill="#d8bd84" />
    </g>

    <!-- Name & Title -->
    <text x="97.5" y="118" text-anchor="middle" fill="#fdfbf7" font-family="Georgia, serif" font-size="16.5" font-weight="700">MUNGRU</text>
    <text x="97.5" y="133" text-anchor="middle" fill="#d8ab76" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" letter-spacing="1">THE GENTLE TITAN</text>

    <!-- Stats & Lore -->
    <g transform="translate(16, 146)">
      <rect x="0" y="0" width="163" height="18" rx="4" fill="#080e11" />
      <text x="8" y="12" fill="#d8ab76" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">DEFENSE: ∞</text>
      <text x="96" y="12" fill="#82b99d" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">NAP EFF: 100%</text>

      <text x="0" y="32" fill="#a7b5ae" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="600">ROLE IN PROS:</text>
      <text x="0" y="46" fill="#fdfcf7" font-family="Georgia, serif" font-size="11" font-weight="600">The Realm Guardian</text>

      <text x="0" y="64" fill="#8ca097" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-style="italic">
        The loyal protector who guards the threshold and enforces guilt-free, restorative sleep.
      </text>
    </g>
  </g>
</svg>
