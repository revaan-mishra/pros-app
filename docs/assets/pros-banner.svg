<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" height="100%">
  <defs>
    <!-- Background Linear & Radial Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a0d" />
      <stop offset="50%" stop-color="#091317" />
      <stop offset="100%" stop-color="#0e1d22" />
    </linearGradient>

    <radialGradient id="nebulaGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#d8bd84" stop-opacity="0.14" />
      <stop offset="50%" stop-color="#3c5e55" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#050a0d" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="compassCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f3e2ba" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#d8bd84" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#b8934b" stop-opacity="0.1" />
    </radialGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseStar {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    @keyframes compassSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes counterSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }
    @keyframes floatRune {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes scanline {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(1000%); }
    }

    .star-1 { animation: pulseStar 3.2s ease-in-out infinite; transform-origin: 120px 60px; }
    .star-2 { animation: pulseStar 2.6s ease-in-out infinite 0.8s; transform-origin: 760px 85px; }
    .star-3 { animation: pulseStar 3.8s ease-in-out infinite 1.5s; transform-origin: 240px 220px; }
    .star-4 { animation: pulseStar 2.1s ease-in-out infinite 0.4s; transform-origin: 680px 230px; }
    .star-5 { animation: pulseStar 4.0s ease-in-out infinite 2.0s; transform-origin: 450px 45px; }

    .compass-outer { animation: compassSpin 60s linear infinite; transform-origin: 110px 160px; }
    .compass-inner { animation: counterSpin 40s linear infinite; transform-origin: 110px 160px; }
    .rune-float { animation: floatRune 5s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="880" height="320" rx="16" fill="url(#bgGrad)" />
  <rect width="880" height="320" rx="16" fill="url(#nebulaGlow)" />
  <rect width="876" height="316" x="2" y="2" rx="14" fill="none" stroke="#d8bd84" stroke-opacity="0.25" stroke-width="1.5" />
  <rect width="864" height="304" x="8" y="8" rx="10" fill="none" stroke="#25423c" stroke-opacity="0.3" stroke-width="1" />

  <!-- Constellation / Star Points -->
  <g fill="#f5edd8">
    <circle cx="120" cy="60" r="1.8" class="star-1" />
    <circle cx="760" cy="85" r="2.2" class="star-2" />
    <circle cx="240" cy="220" r="1.5" class="star-3" />
    <circle cx="680" cy="230" r="2.0" class="star-4" />
    <circle cx="450" cy="45" r="1.6" class="star-5" />
    <circle cx="810" cy="180" r="1.2" opacity="0.6" />
    <circle cx="330" cy="80" r="1.4" opacity="0.4" />
    <circle cx="580" cy="270" r="1.5" opacity="0.5" />
    <circle cx="70" cy="260" r="1.3" opacity="0.4" />
  </g>

  <!-- Constellation Subtle Connector Lines -->
  <path d="M120,60 L240,220 M760,85 L680,230 M450,45 L580,270" stroke="#d8bd84" stroke-opacity="0.07" stroke-width="1" stroke-dasharray="3,3" />

  <!-- LEFT EMBLEM: Mechanical Astrolabe / Celestial Compass -->
  <g transform="translate(10, 0)">
    <!-- Subtle Back Glow for Compass -->
    <circle cx="110" cy="160" r="75" fill="url(#compassCenter)" opacity="0.12" />

    <!-- Outer Compass Ring with Ticks -->
    <g class="compass-outer">
      <circle cx="110" cy="160" r="72" fill="none" stroke="#d8bd84" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="2,6" />
      <circle cx="110" cy="160" r="66" fill="none" stroke="#d8bd84" stroke-opacity="0.25" stroke-width="1" />
      <line x1="110" y1="88" x2="110" y2="94" stroke="#d8bd84" stroke-width="2" />
      <line x1="110" y1="226" x2="110" y2="232" stroke="#d8bd84" stroke-width="2" />
      <line x1="38" y1="160" x2="44" y2="160" stroke="#d8bd84" stroke-width="2" />
      <line x1="176" y1="160" x2="182" y2="160" stroke="#d8bd84" stroke-width="2" />
    </g>

    <!-- Inner Astrolabe Ring -->
    <g class="compass-inner">
      <circle cx="110" cy="160" r="48" fill="none" stroke="#a7d9c3" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="8,4" />
      <polygon points="110,122 118,155 110,160 102,155" fill="#d8bd84" opacity="0.8" />
      <polygon points="110,198 118,165 110,160 102,165" fill="#3c5e55" opacity="0.8" />
      <polygon points="72,160 105,152 110,160 105,168" fill="#5a7e72" opacity="0.6" />
      <polygon points="148,160 115,152 110,160 115,168" fill="#d8bd84" opacity="0.6" />
    </g>

    <!-- Center Core Pivot -->
    <circle cx="110" cy="160" r="6" fill="#f5edd8" filter="url(#goldGlow)" />
    <circle cx="110" cy="160" r="3" fill="#091317" />
  </g>

  <!-- RIGHT CONTENT BLOCK -->
  <g transform="translate(225, 0)">
    <!-- Eyebrow / Classification -->
    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="138" height="20" rx="4" fill="#142621" stroke="#3c5e55" stroke-width="1" />
      <circle cx="10" cy="10" r="3.5" fill="#82b99d" filter="url(#subtleGlow)" />
      <text x="20" y="14" fill="#a7d9c3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="9.5" font-weight="700" letter-spacing="1.5">STANDALONE OS</text>

      <rect x="146" y="0" width="154" height="20" rx="4" fill="#201a11" stroke="#68542d" stroke-width="1" />
      <text x="156" y="14" fill="#e0c897" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="9.5" font-weight="600" letter-spacing="1.2">LOCAL-FIRST CANON</text>

      <rect x="308" y="0" width="134" height="20" rx="4" fill="#1c1624" stroke="#4c3961" stroke-width="1" />
      <text x="318" y="14" fill="#cbb3e6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="9.5" font-weight="600" letter-spacing="1.2">ZERO STREAK GUILT</text>
    </g>

    <!-- Main Title: PROS -->
    <text x="0" y="126" fill="#fdfcf7" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" letter-spacing="4" filter="url(#goldGlow)">
      PROS
    </text>

    <!-- Diamond Separator -->
    <text x="210" y="118" fill="#d8bd84" font-family="serif" font-size="28" opacity="0.8">✧</text>

    <!-- Sub-Heading: Acronym Meaning -->
    <text x="240" y="116" fill="#d8bd84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16.5" font-weight="700" letter-spacing="3.5">
      PERSONAL RPG OPERATING SYSTEM
    </text>

    <!-- Hero Value Proposition -->
    <text x="2" y="162" fill="#c6d2cc" font-family="Georgia, serif" font-style="italic" font-size="18.5" letter-spacing="0.3">
      "Your life is not a spreadsheet. Stop managing tasks. Start restoring a realm."
    </text>

    <!-- Human Explanation -->
    <text x="2" y="196" fill="#8e9f97" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400">
      1 minute focused effort = 1 XP • 0 punitive decay • Offline-first IndexedDB • 6 illustrated lands
    </text>

    <!-- Bottom Status Bar / System Pill Strip -->
    <g transform="translate(0, 232)">
      <!-- Dark container box -->
      <rect x="0" y="0" width="620" height="42" rx="8" fill="#091317" stroke="#d8bd84" stroke-opacity="0.3" stroke-width="1" />

      <!-- Segment 1: Engine -->
      <text x="16" y="25" fill="#758880" font-family="ui-monospace, monospace" font-size="11">ENGINE:</text>
      <text x="70" y="25" fill="#f5edd8" font-family="ui-monospace, monospace" font-size="11" font-weight="700">React 19 + Vite 6</text>

      <!-- Divider -->
      <line x1="205" y1="10" x2="205" y2="32" stroke="#263832" stroke-width="1" />

      <!-- Segment 2: Storage -->
      <text x="220" y="25" fill="#758880" font-family="ui-monospace, monospace" font-size="11">STORAGE:</text>
      <text x="286" y="25" fill="#a7d9c3" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Dexie 4 (Local-First)</text>

      <!-- Divider -->
      <line x1="435" y1="10" x2="435" y2="32" stroke="#263832" stroke-width="1" />

      <!-- Segment 3: Companion -->
      <text x="450" y="25" fill="#758880" font-family="ui-monospace, monospace" font-size="11">CO-PILOT:</text>
      <text x="518" y="25" fill="#e8d8b5" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Olive (Spitz v1.0)</text>
    </g>
  </g>
</svg>
