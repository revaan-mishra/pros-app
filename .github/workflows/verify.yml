name: Verify PROS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11.25.0'

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify credited assets
        run: pnpm check:assets

      - name: Run unit tests
        run: pnpm test

      - name: Check the local HTTP server
        run: pnpm check:server

      - name: Build the production app
        run: pnpm build
        env:
          VITE_REQUIRE_CLOUD: 'false'
